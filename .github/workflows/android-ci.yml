name: Android CI/CD Pipeline

on:
  push:
    branches: [ "main", "master", "developer" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master", "developer" ]
  workflow_dispatch:

jobs:
  build-and-release:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Extract App Version from build.gradle.kts
        id: get_version
        run: |
          VERSION_NAME=$(grep 'versionName = ' app/build.gradle.kts | head -n 1 | cut -d '"' -f 2)
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "Extracted App Version: $VERSION_NAME"

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --continue

      - name: Build Debug & Release APKs
        run: ./gradlew assembleDebug assembleRelease

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ExpenseTracker-Debug-v${{ steps.get_version.outputs.VERSION_NAME }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ExpenseTracker-Release-v${{ steps.get_version.outputs.VERSION_NAME }}
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Automatically Create/Update GitHub Release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.get_version.outputs.VERSION_NAME }}"
          name: "Expense Tracker v${{ steps.get_version.outputs.VERSION_NAME }}"
          body: |
            ## Expense Tracker v${{ steps.get_version.outputs.VERSION_NAME }}
            Automated Release built by GitHub Actions CI/CD pipeline.
            
            ### Included Assets:
            - `app-debug.apk`
            - `app-release-unsigned.apk`
          files: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
